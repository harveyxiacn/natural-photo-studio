name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 40f3c709db80acf154ac4b17a1f83c564ebd022e
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch pinned vcpkg
        shell: bash
        run: |
          mkdir -p .tools
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/microsoft/vcpkg.git .tools/vcpkg
          git -C .tools/vcpkg fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C .tools/vcpkg checkout --detach "$VCPKG_COMMIT"
          actual_commit="$(git -C .tools/vcpkg rev-parse --verify HEAD)"
          test "$actual_commit" = "$VCPKG_COMMIT"

      - name: Bootstrap vcpkg
        shell: bash
        run: ./.tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # CodeQL manual mode traces every C/C++ compilation after initialization.
      # Install third-party sources first so alerts remain scoped to this repo.
      - name: Preinstall pinned dependencies outside CodeQL extraction
        shell: bash
        run: |
          ./.tools/vcpkg/vcpkg install \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --triplet x64-linux \
            --clean-after-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure and build
        shell: bash
        run: |
          cmake --preset dev \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build --preset dev

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:c-cpp
