name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 40f3c709db80acf154ac4b17a1f83c564ebd022e
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Fetch pinned vcpkg
        shell: bash
        run: |
          mkdir -p .tools
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/microsoft/vcpkg.git .tools/vcpkg
          git -C .tools/vcpkg fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C .tools/vcpkg checkout --detach "$VCPKG_COMMIT"

      - name: Bootstrap vcpkg
        shell: bash
        run: ./.tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure and build
        shell: bash
        run: |
          cmake --preset dev
          cmake --build --preset dev

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:c-cpp
